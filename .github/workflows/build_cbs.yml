name: Build Python package on CBS-like machine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build for Windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Python info
        shell: bash -e {0}
        run: |
          which python
          python --version
      - name: Download requirements file
        run: |
          curl "https://raw.githubusercontent.com/sodascience/cbs_python/refs/heads/main/environment0000.txt" -o environment0000.txt
      - name: Install pip and install project environment
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r environment0000.txt
      - name: Create derived virtual environment
        shell: bash -e {0}
        run: |
          python -m venv --system-site-packages .venv
          source .venv/Scripts/activate
          python -m pip install .[dev] --no-build-isolation
      - name: Run unit tests
        run: .venv/Scripts/python -m pytest -v
      - name: Verify that we can build the package
        run: .venv/Scripts/python -m build
